<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>Forms</title></head>
  <body>
    <!-- Netlify detects this form at deploy time. The React waitlist form POSTs here with fetch. -->
    <form name="waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="waitlist" />
      <input name="bot-field" />
      <input type="email" name="email" />
      <input name="location" />
      <input name="role" />
      <input name="consent" />
      <input name="source" />
      <textarea name="game"></textarea>
    </form>
  </body>
</html>
